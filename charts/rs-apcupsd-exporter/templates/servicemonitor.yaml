{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rs-apcupsd-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rs-apcupsd-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rs-apcupsd-exporter.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
  - port: metrics
    path: /metrics
{{- end }}
